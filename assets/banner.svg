<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#141b2d"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>

    <!-- Title Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Animated Pipeline Stream Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Node Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes waveFlow1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveFlow2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.35); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    .wave1 { animation: waveFlow1 12s ease-in-out infinite; }
    .wave2 { animation: waveFlow2 16s ease-in-out infinite; }
    .flow-dash { animation: dashMove 8s linear infinite; }
    .pulse-dot { animation: pulseGlow 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  </style>

  <!-- SOLID SVG BACKGROUND RECTANGLE -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)"/>

  <!-- DYNAMIC ANIMATED BACKGROUND LAYER -->
  <g opacity="0.38">
    <!-- Grid pattern lines representing video render frames and timelines -->
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>

    <line x1="180" y1="0" x2="180" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="380" y1="0" x2="380" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="580" y1="0" x2="580" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="780" y1="0" x2="780" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>
    <line x1="980" y1="0" x2="980" y2="360" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 6"/>

    <!-- Dynamic Flow Waves (Transcoding Pipelines) -->
    <path class="wave1 flow-dash" d="M -50,265 Q 260,170 560,265 T 1180,215" fill="none" stroke="url(#streamGrad1)" stroke-width="3" stroke-dasharray="16 12"/>
    <path class="wave2 flow-dash" d="M -50,115 Q 360,215 760,115 T 1260,185" fill="none" stroke="url(#streamGrad2)" stroke-width="3.5" stroke-dasharray="20 14"/>

    <!-- Glowing render node indicators -->
    <circle cx="150" cy="115" r="5" fill="#38bdf8" filter="url(#glow)" class="pulse-dot"/>
    <circle cx="950" cy="85" r="6" fill="#818cf8" filter="url(#glow)" class="pulse-dot" style="animation-delay: 1.2s;"/>
    <circle cx="1070" cy="265" r="5" fill="#c084fc" filter="url(#glow)" class="pulse-dot" style="animation-delay: 2.1s;"/>
    <circle cx="270" cy="285" r="6.5" fill="#38bdf8" filter="url(#glow)" class="pulse-dot" style="animation-delay: 1.6s;"/>
  </g>

  <!-- FOREGROUND CONTENT LAYER (Crisp high-contrast title, subtitle, and badges) -->
  <g transform="translate(60, 0)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="235" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="26" y="18" fill="#e2e8f0" font-size="11" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="0.5">OPEN-SOURCE &amp; SAAS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#titleGrad)" font-size="38" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="-0.5">
      Awesome Video Rendering &amp; Processing
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#94a3b8" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      Curated Guide to Transcoding, Encoding, Frame Filtering, ABR Packaging &amp; Transformation Pipelines
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: Transcoding & Encoding -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="84" y="19" fill="#38bdf8" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Transcoding &amp; Encoding</text>
      </g>

      <!-- Pill 2: FFmpeg & Codecs -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="140" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
        <text x="70" y="19" fill="#818cf8" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">FFmpeg &amp; Codecs</text>
      </g>

      <!-- Pill 3: Frame Processing -->
      <g transform="translate(332, 0)">
        <rect x="0" y="0" width="138" height="30" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
        <text x="69" y="19" fill="#c084fc" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Frame Processing</text>
      </g>

      <!-- Pill 4: Cloud Media SaaS -->
      <g transform="translate(482, 0)">
        <rect x="0" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
        <text x="72" y="19" fill="#f472b6" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Cloud Media SaaS</text>
      </g>

      <!-- Pill 5: ABR & Packaging -->
      <g transform="translate(639, 0)">
        <rect x="0" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
        <text x="72" y="19" fill="#34d399" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">ABR &amp; Packaging</text>
      </g>
    </g>

    <!-- Bottom Metadata Line -->
    <text x="0" y="292" fill="#64748b" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      🎬 Updated for 2026  •  ⚡ Frame-Accurate Rendering  •  🔄 Distributed Transcoding  •  🌐 Cloud &amp; Open-Source
    </text>

  </g>
</svg>
